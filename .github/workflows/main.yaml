on: [push, pull_request]

jobs:
    static:
        container: asherikov/ccws
        runs-on: ubuntu-latest
        env:
            BUILD_PROFILE: static_checks
        steps:
            - uses: actions/checkout@v4
            - run: |
                cd /ccws
                export WORKSPACE_SRC=${GITHUB_WORKSPACE}
                make wsupdate_pkgs_shallow
                rm -rf ${GITHUB_WORKSPACE}/ariles/ariles2_rosparam_ws
                make

    tidy:
        container: asherikov/ccws
        runs-on: ubuntu-latest
        env:
            BUILD_PROFILE: scan_build
        steps:
            - uses: actions/checkout@v4
            - run: |
                cd /ccws
                export WORKSPACE_SRC=${GITHUB_WORKSPACE}
                make wsupdate_pkgs_shallow
                rm -rf ${GITHUB_WORKSPACE}/ariles/ariles2_rosparam_ws
                apt update
                make dep_install
                make build_all

    reldebug:
        container: asherikov/ccws
        runs-on: ubuntu-latest
        env:
            BUILD_PROFILE: reldebug
        steps:
            - uses: actions/checkout@v4
            - run: |
                cd /ccws
                export WORKSPACE_SRC=${GITHUB_WORKSPACE}
                make wsupdate_pkgs_shallow
                rm -rf ${GITHUB_WORKSPACE}/ariles/ariles2_rosparam_ws
                apt update
                make dep_install
                make build_all
                make wstest

    addr_sanitizer:
        container: asherikov/ccws
        runs-on: ubuntu-latest
        env:
            BUILD_PROFILE: addr_undef_sanitizers
        steps:
            - uses: actions/checkout@v4
            - run: |
                cd /ccws
                export WORKSPACE_SRC=${GITHUB_WORKSPACE}
                make wsupdate_pkgs_shallow
                rm -rf ${GITHUB_WORKSPACE}/ariles/ariles2_rosparam_ws
                apt update
                make dep_install
                make build_all
                make wstest

    thread_sanitizer:
        container: asherikov/ccws
        runs-on: ubuntu-latest
        env:
            BUILD_PROFILE: thread_sanitizer
        steps:
            - uses: actions/checkout@v4
            - run: |
                cd /ccws
                export WORKSPACE_SRC=${GITHUB_WORKSPACE}
                make wsupdate_pkgs_shallow
                rm -rf ${GITHUB_WORKSPACE}/ariles/ariles2_rosparam_ws
                echo "race:libfastrtps.so.*" >> /ccws/ccws/profiles/build/thread_sanitizer/thread.supp
                apt update
                make dep_install
                make build_all
                make wstest

    doxygen:
        container: asherikov/ccws
        runs-on: ubuntu-latest
        env:
            BUILD_PROFILE: doxygen
        steps:
            - uses: actions/checkout@v4
            - run: |
                cd /ccws
                export WORKSPACE_SRC=${GITHUB_WORKSPACE}
                make wsupdate_pkgs_shallow
                rm -rf ${GITHUB_WORKSPACE}/ariles/ariles2_rosparam_ws
                make

    deb:
        container:
            image: asherikov/ccws
            options: --security-opt seccomp:unconfined
        runs-on: ubuntu-latest
        env:
            EMAIL: example@example.com
            AUTHOR: CI
        steps:
            - uses: actions/checkout@v4
            - run: |
                cd /ccws
                export WORKSPACE_SRC=${GITHUB_WORKSPACE}
                make wsupdate_pkgs_shallow
                rm -rf ${GITHUB_WORKSPACE}/ariles/ariles2_rosparam_ws
                apt update
                make dep_install
                make build_all BUILD_PROFILE=deb,reldebug VENDOR=sharf
