on:
    push:
        branches:
            - '**'
        tags:
            - 'NEVER'
    pull_request:
        types: [opened, reopened]

jobs:
    tests_jammy:
        uses: asherikov/ccws/.github/workflows/reusable_test.yaml@master
        with:
            distro: jammy
            workspace_github_repo: asherikov/sharf
            workspace_version: ${{ github.sha }}

    tests_noble:
        uses: asherikov/ccws/.github/workflows/reusable_test.yaml@master
        with:
            distro: noble
            workspace_github_repo: asherikov/sharf
            workspace_version: ${{ github.sha }}

    tests_resolute:
        uses: asherikov/ccws/.github/workflows/reusable_test.yaml@master
        with:
            distro: resolute
            workspace_github_repo: asherikov/sharf
            workspace_version: ${{ github.sha }}

    gh_pages:
        uses: asherikov/ccws/.github/workflows/reusable_dox.yaml@master
        with:
            distro: resolute
            version: ${{ github.ref_name }}
            push: false
        permissions:
            contents: write

    deb_noble_arm64:
        uses: asherikov/ccws/.github/workflows/reusable_deb.yaml@master
        with:
            distro: noble
            workspace_github_repo: asherikov/sharf
            workspace_version: ${{ github.sha }}
            profile: cross_arm64
        secrets:
            cloudsmith_token: ${{ secrets.CLOUDSMITH_API_KEY }}

