on:
    push:
        tags:
            - '**'

jobs:
    gh_pages:
        uses: ./.github/workflows/dox.yaml
        with:
            distro: noble
            version: ${{ github.ref_name }}
        permissions:
            contents: write

    deb_jammy:
        uses: ./.github/workflows/deb.yaml
        with:
            distro: jammy
            workspace_github_repo: asherikov/sharf
            workspace_version: ${{ github.sha }}
            cloudsmith_repo: asherikov-aV7/all/ubuntu/jammy
        secrets:
            cloudsmith_token: ${{ secrets.CLOUDSMITH_API_KEY }}

    deb_noble:
        uses: ./.github/workflows/deb.yaml
        with:
            distro: noble
            workspace_github_repo: asherikov/sharf
            workspace_version: ${{ github.sha }}
            cloudsmith_repo: asherikov-aV7/all/ubuntu/jammy
        secrets:
            cloudsmith_token: ${{ secrets.CLOUDSMITH_API_KEY }}
